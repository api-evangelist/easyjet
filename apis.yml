apis:
- aid: easyjet:brand-widgets
  name: easyJet Brand Widget Service (easyDom)
  description: >-
    easyJet's hosted client-side widget platform for partner and white-label
    sites. Each widget is a script tag on brand.easyjet.com whose behaviour is
    driven by query-string parameters and scoped to a partner identifier. The
    branding widgets (Header.js, Footer.js) answer anonymously with HTTP 200; the
    identity widgets (Script.js, SignIn.js, Registration.js, VRPanel.js) return a
    zero-byte body unless the partner id is recognised, and drive easyJet customer
    sign-in, registration and visitor recognition through the easyDom JavaScript
    library in Redirect, Dialog or Embedded mode. easyJet publishes no
    documentation, no versioning and no support channel for this surface; the
    parameter and callback contract catalogued here was observed verbatim from
    easyJet's own publicly indexed sample partner implementation. It is not a data
    API — no flight search, booking or ancillary operation is exposed — but it is
    the only easyJet integration surface reachable without a commercial agreement.
  humanURL: https://www.easyjet.com/en/business/travel-trade-partners
  baseURL: https://brand.easyjet.com/en/
