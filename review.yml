actions:
  apisYmlUpdated: true
  openapiHarvested: false
  specsSaved: 0
  reason: >-
    Recorded as an honest stub with a full switching-cost record. easyJet
    operates a real, production distribution API — named in its own charter and
    consumed by fourteen approved aggregators — but publishes no developer
    portal, no reference documentation, no machine-readable specification, no
    authentication metadata and no webhook catalogue. apis[] is intentionally
    empty because listing an Akamai-gated hostname as an API would be
    fabrication. The value of this record is the switchingCost block: easyJet
    is the clearest example in the UK travel seam of lock-in achieved by
    private contract rather than by standard — a carrier that never needed NDC
    because it never had a GDS to escape, and whose API is consequently
    reusable against nothing else on earth.
