aid: easyjet
name: easyJet
review:
  question: Does easyJet publish a public, self-serve developer portal or downloadable
    API specifications, and what would it cost a reseller to leave?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: airline
  gated: true
findings:
  summary: |
    easyJet Airline Company Limited is a British low-cost short-haul carrier
    (company number 03034606, registered office Hangar 89, London Luton
    Airport — both stated verbatim in its own Distribution Charter). It
    publishes NO developer portal, NO API reference documentation, and NO
    machine-readable API contract of any kind.

    What it DOES publish, and what makes this record worth having, is the
    commercial contract that governs API access. The easyJet Distribution
    Charter (version March 2026) is a public, citable document that states in
    section 2 that a Reseller must "only access easyJet Data: (i) via an
    easyJet Approved Channel which has entered into an API agreement with
    easyJet; or (ii) directly via the easyJet API, if the Reseller has a
    Direct API Agreement with easyJet." A companion page names the fourteen
    Approved Channels and grades each on nine content capabilities as of the
    end of May 2026. That is unusually transparent about the SHAPE of the
    commercial relationship and completely silent about the shape of the
    interface.

    Every conventional developer hostname on easyjet.com fails to resolve:
    developer, developers, docs, apis, ndc, partner, partners, trade, agent,
    agents, sandbox, dev, portal, connect, xml, mcp, status, trust. Two real
    API hostnames DO exist — api.easyjet.com and b2b.easyjet.com, both CNAMEd
    to Akamai edgekey — and both return HTTP 403 "Access Denied" from an
    Akamai edgesuite error page on every path probed, including
    /openapi.json, /swagger.json, /api-docs and
    /.well-known/openid-configuration. gateway.easyjet.com resolves to
    195.153.65.6 and times out. mobile.easyjet.com returns 503 with an Akamai
    bot-defence script. www.easyjet.com/developers and /api return 404. There
    is no security.txt, no llms.txt, no /.well-known/api-catalog and no
    openapi.json at the web root.

    The NDC finding is the sector-relevant one. easyJet is NOT an NDC
    carrier. The March 2026 Distribution Charter never uses the word NDC.
    easyJet does not appear in ndctracker.com's list of 73 airlines with
    launched or in-development NDC programmes. Its own approved channels
    describe the connection as a direct-connect proprietary API rather than
    NDC: Duffel's easyJet page calls it "Direct Connect", and AirGateway's
    2023 announcement positions its Kyte-facilitated easyJet link as "an
    effective API-based connection to easyJet" listed SEPARATELY from the
    "27+ major NDC airlines" it also carries. easyJet is the carrier that
    never needed NDC because it never had a GDS dependency to escape — it
    built a direct API and made the GDSes come to it. Amadeus, Sabre and
    Travelport appear on the approved-channels list as three of fourteen API
    partners, not as the rail easyJet files fares into.

    There is no official easyJet GitHub organisation. github.com/Easyjet is
    an unverified 2013 account with a single repository, "flugbokun", with no
    description and no easyJet attribution; it is not treated as first-party.
    Third-party projects such as opayen/easyjet-api and the AirLabs "EasyJet
    API" product are independent reverse-engineering or flight-data
    offerings, not easyJet interfaces, and are deliberately NOT listed.
