  domainSecurity:
    dmarc: v=DMARC1; p=reject; sp=reject; fo=1 (Proofpoint reporting)
    securityTxt: false
    note: >-
      DMARC is at full enforcement with subdomain policy reject, reported to
      Proofpoint. No RFC 9116 security.txt is published at either the well-known
      or legacy path, and no vulnerability disclosure programme was found.
  regulatory:
    regime: >-
      UK CAA operating licence; UK GDPR / Data Protection Act 2018; ATOL
      Regulations and Package Travel Regulations (UK) referenced directly in the
      Distribution Charter; EU261/UK261 passenger rights.
    openDataMandate: none
    note: >-
      Nothing in UK or EU law compels an airline to publish a distribution API
      or a machine-readable contract. The only portability obligation that
      bites is UK GDPR Article 20, which easyJet honours on request and scopes
      to flight and holiday history.
switchingCost:
  interfaceShape:
    value: proprietary-undocumented
    standardNamed: none
    evidence: >-
      The Distribution Charter names "the easyJet API" and defines a "Direct API
      Agreement" as "an API agreement entered into between the Reseller and
      easyJet granting the Reseller direct access to the easyJet Data" — but no
      protocol, base URL, operation, schema, authentication scheme or scope is
      published anywhere. No OpenAPI, Swagger, AsyncAPI, GraphQL SDL, WSDL or
      XSD was found. No IATA NDC schema reference, no OpenTravel/OTA reference,
      no OpenAPI reference. api.easyjet.com and b2b.easyjet.com both answer
      403 from Akamai on every path. The contract shape is therefore bilateral
      and unique to easyJet: an integration built against it is not portable to
      any other carrier, and no other party implements it.
    note: >-
      This is the single most important switching-cost signal here. A reseller
      that integrates the easyJet API directly is building against a shape only
      easyJet defines and only easyJet can change. Because the charter also
      reserves the right for easyJet to amend the charter "from time to time,
      without notice, by amending this page", the commercial terms attached to
      that shape are unilaterally mutable too.
  secondSource:
    value: alternatives-with-migration
    alternativesConsidered:
    - name: Direct API Agreement with easyJet
      note: Bilateral, negotiated, undocumented. No published application route.
    - name: Amadeus
      note: Approved channel. Full matrix except Flex Pass Extra and Smart+.
    - name: Anaxys
      note: Approved channel. Seat selection, hold bags, Inclusive, Inclusive Plus only.
    - name: Bewotec
      note: Approved channel. No large cabin bag, no Flex; has Smart+.
    - name: Duffel
      note: >-
        Approved channel and the sector's most-watched API-first booking layer.
        Full matrix except Flex Pass Extra. Describes the link as Direct Connect.
    - name: JFA Systems
      note: Approved channel. Narrow content set.
    - name: Kyte
      note: >-
        Approved channel with the complete nine-of-nine functionality matrix.
        Facilitates easyJet content into AirGateway.
    - name: Paxport
      note: Approved channel with the complete nine-of-nine functionality matrix.
    - name: Peakwork
      note: Approved channel. Tour-operator oriented, no post-booking servicing.
    - name: Sabre
      note: Approved channel. Full matrix except Flex Pass Extra.
    - name: Travelfusion
      note: >-
        Approved channel with the complete nine-of-nine functionality matrix.
        The long-standing LCC direct-connect aggregator.
    - name: Travelport
      note: >-
        Approved channel. Seat, large cabin bag, hold bags, Inclusive,
        Inclusive Plus and post-booking servicing; no Flex, Pass Extra or Smart+.
    - name: Traveltek
      note: Approved channel. Narrow content set, no post-booking servicing.
    - name: Viaxoft
      note: Approved channel.
    - name: Ypsilon
      note: Approved channel. No Flex, Pass Extra or Smart+.
    evidence: >-
      https://www.easyjet.com/en/business/approved-channels- names fourteen
      Approved Channels and grades each across nine content capabilities (seat
      selection, large cabin bag, hold bags, Flex, Pass Extra, Smart+,
      Inclusive, Inclusive Plus, post-booking servicing) with the matrix
      explicitly dated to the end of May 2026.
    note: >-
      Read carefully, this is two different answers. For easyJet's own seat
      inventory there is NO second source: only easyJet sells easyJet seats,
      and no other carrier's API substitutes. For the ROUTE to that inventory
      there are genuinely fourteen alternatives, and easyJet publishes a matrix
      that lets a reseller compare them — which is more transparency than most
      carriers offer. But the alternatives are not interchangeable: each
      aggregator exposes its own proprietary interface, and the published
      matrix shows they differ materially in what easyJet content they can
      actually sell (only Kyte, Paxport and Travelfusion carry all nine
      capabilities; Anaxys, JFA Systems and Traveltek carry four). Switching
      channel is therefore a re-integration project plus a content-coverage
      regression. Hence alternatives-with-migration, not
      interchangeable-alternatives.
  exitPath:
    value: export-on-request
    operationCited: none
    evidence: >-
      No export, dump, bulk or reporting operation is published, because no API
      is published. The only implemented data-portability commitment is
      consumer-side and lives in the privacy notice PDF: "You have the right to
      receive some of your Personal Data in a portable and reusable format.
      Your right to data portability only applies to your flight and holiday
      history." The PDF gives a worked example of the exportable record —
      booking reference, date, flight number, origin, destination, currency,
      price, seat number (e.g. FG123H / 23/12/2016 / EZY123 / LTN / LIS / GBP /
      25.99 / 9B). Requests are made "via easyJet's online privacy notice which
      is available at (www.easyJet.com)" or by contacting
      data.protection@easyJet.com.
    note: >-
      This is a UK GDPR Article 20 right honoured on request, explicitly scoped
      to flight and holiday history only — not an API operation, not
      self-serve, and nothing at all for a reseller or corporate customer.
      There is no published mechanism by which a travel agency could extract
      its own easyJet booking book. Scored export-on-request on the strength of
      the consumer commitment alone.
  identifierPortability:
    summary: >-
      Shared IATA identifiers on the surface, proprietary booking key underneath.
    identifiersFound:
    - identifier: IATA 3-letter airport codes
      portable: true
      evidence: LTN and LIS used in the privacy notice's portability example.
    - identifier: ICAO/IATA flight designator EZY
      portable: true
      evidence: >-
        Flight number "EZY123" in the privacy notice example. easyJet's ICAO
        designator EZY; the carrier trades under IATA code U2.
    - identifier: easyJet booking reference (6-character alphanumeric PNR-style locator)
      portable: false
      evidence: >-
        "FG123H" in the privacy notice example, labelled "Booking reference".
        This is easyJet's own record locator; nothing published maps it to any
        GDS record, IATA ticket number or interline document.
    - identifier: IATA/ARC agency accreditation number
      portable: notRequired
      evidence: >-
        The Distribution Charter never mentions IATA accreditation, ARC, BSP or
        an agency numeric code as a prerequisite. Eligibility is defined purely
        by holding an API agreement, directly or through an Approved Channel.
    note: >-
      The consumer-facing schema hangs on shared industry codes, which travel.
      The commercial key — the booking reference that identifies the sellable
      thing — is easyJet's own, and there is no published cross-reference to a
      GDS record locator or an IATA ticket number. easyJet is not distributing
      through interline ticketing, so the usual portable ticket identifier
      never enters the picture.
  contractualLockIn:
    published: true
    document: easyJet Distribution Charter
    version: March 2026
    url: https://www.easyjet.com/en/business/distribution-charter
    governingLaw: >-
      "This Distribution Charter shall be governed by the laws of England and
      Wales. The courts of England and Wales will have exclusive jurisdiction in
      connection with this Distribution Charter (including any claims or
      disputes)."
    verbatim:
    - clause: Access restriction (section 2(a))
      text: >-
        "Resellers must: (a) only access easyJet Data: (i) via an easyJet
        Approved Channel which has entered into an API agreement with easyJet;
        or (ii) directly via the easyJet API, if the Reseller has a Direct API
        Agreement with easyJet."
    - clause: Anti-scraping (section 2(c))
      text: >-
        "not gather, extract, reproduce, re-utilise or display easyJet Data by
        any means, such as the use of 'screen scraping' software or any other
        automated means used to extract data such as program, robot, web
        crawler, spider, data mining, trawling or other 'screen scraping'
        software, process or program"
    - clause: Website use (section 2(b))
      text: >-
        "not use the easyJet website other than if/as specifically permitted by
        easyJet in writing"
    - clause: Unilateral amendment (section 1)
      text: >-
        "easyJet may amend the Distribution Charter from time to time, without
        notice, by amending this page. The amended Distribution Charter will be
        effective from the date it is posted to our website... Your continued
        use of easyJet Data and the easyJet website/channels/services will
        constitute your acceptance of the amended Distribution Charter."
    - clause: Termination and booking cancellation (section 13)
      text: >-
        "easyJet reserves the right to take action at any time against any
        Resellers who do not comply, or are suspected of not complying with,
        this Distribution Charter, including restricting, suspending or
        terminating the Reseller's access to the easyJet Data, cancelling any
        easyJet flight bookings made by a Reseller, preventing the Reseller from
        making future easyJet flight bookings and seeking all remedies available
        by law."
    - clause: Investigation consent (section 13)
      text: >-
        "easyJet reserves the right to investigate any suspected non-compliance
        with this Distribution Charter using appropriate technology or other
        means. By accessing easyJet Data, Resellers consent to easyJet carrying
        out such investigations as may be necessary to identify or prevent
        non-compliance."
    - clause: Mandatory customer data submission (section 4(a))
      text: >-
        "submit the Customer's email address and mobile telephone number to
        easyJet via the API as soon as the booking is made."
    - clause: Check-in prohibition (section 6)
      text: >-
        "Resellers are not permitted to check in on behalf of Customers
        (including through the use of any automated process)."
    - clause: Prohibited payment routing (section 12)
      text: >-
        "Resellers must not facilitate or enable any booking transaction where
        the Customer makes a direct booking on easyJet's website, mobile app, or
        other official channels using a card, voucher, or other payment
        instrument issued or funded by the Reseller, including any prepaid debit
        card, unless expressly authorised in writing by easyJet."
    - clause: Refund flow (section 5)
      text: >-
        "Any refunds due from easyJet to Customers will be made to the original
        method of payment... The Reseller must then refund the Customer on
        behalf of easyJet within [2] working days of receipt of the relevant
        funds from easyJet."
    - clause: Reseller fee disclosure (section 3(b))
      text: >-
        "Any additional charges imposed by the Reseller (including, but not
        limited to, any booking or service fees for flights and/or ancillary
        services such as seating, bags, name and date changes) must be clearly
        identified as an additional fee to the easyJet flight charged by the
        Reseller."
    - clause: Brand licence (section 10)
      text: >-
        "The 'easyJet' brand is licensed to easyJet by easyGroup Limited
        ('easyGroup') and accordingly the Reseller must comply with any
        instructions from easyJet or easyGroup in relation to the 'easyJet'
        brand or any other 'easy' trademark."
    - clause: ATOL (section 7)
      text: >-
        "In respect of UK sales, Resellers are only permitted to sell easyJet
        products and services where their bookings are ATOL protected by the
        Reseller. Where ATOL protection is not required under the regulations,
        the Reseller must state clearly on the booking confirmation 'This sale
        is not ATOL protected'."
    notPublished:
    - Minimum term or contract length
    - Exclusivity or full-content obligations
    - Per-segment or per-booking fees payable by the reseller to easyJet
    - Termination notice period
    - Commission or incentive structure
    - Service-level or uptime commitments
    - Any pricing for a Direct API Agreement
    note: >-
      The behavioural terms are unusually well published for this sector; the
      COMMERCIAL terms are not published at all. Everything a buyer would need
      to price the relationship — term, fees, exclusivity, notice — lives in
      the unpublished Direct API Agreement or the aggregator's own contract.
      Nothing here should be inferred beyond the quoted text.
  accessGate:
    value: commercial-agreement
    selfServe: false
    whatADeveloperMustSign: >-
      Either (a) a Direct API Agreement with easyJet — a bilateral contract with
      no published application form, no published contact, no published pricing
      and no published eligibility criteria; or (b) the commercial agreement of
      one of the fourteen Approved Channels, each of which has itself "entered
      into an API agreement with easyJet". In both cases the reseller is
      additionally bound by the Distribution Charter and the Acceptable Use
      Policy, under English law. No IATA or ARC accreditation is named as a
      requirement. There is no sandbox, no trial, no API key self-signup, and
      no published rate limits.
    note: >-
      easyJet publishes WHO you can go through and WHAT you must not do, but
      never HOW to apply. The travel-trade-partners hub gives an email address
      only for whole-plane charters and series seat allotments
      (charters@easyjet.com); everything else routes to "contact your approved
      channel".
  distributionModel:
    value: aggregator-reseller
    detail: >-
      Predominantly direct-to-consumer through easyjet.com and the easyJet app,
      with agency and OTA reach delivered through fourteen Approved Channels
      that each hold an API agreement with easyJet, plus a bilateral Direct API
      Agreement path for individual resellers. Amadeus, Sabre and Travelport
      appear on that list as three of fourteen API partners rather than as the
      distribution rail — easyJet is a carrier the GDSes connect to, not one
      that files into them. easyJet was among the first European low-fares
      airlines to make inventory available through a GDS at all, via Amadeus
      and Galileo in 2007 for the corporate travel market, with Sabre renewing
      a distribution agreement in 2020.
  ndcPosture:
    isNdc: false
    certificationLevelClaimed: none
    ndcApiPublished: false
    gdsSurchargeVerified: false
    evidence: >-
      The Distribution Charter (March 2026) does not contain the string NDC.
      easyJet does not appear on ndctracker.com's list of 73 airlines with
      launched or in-development NDC programmes. IATA has sunset the old NDC
      certification registry in favour of the ARM index, and no easyJet entry
      was found. Approved channels describe the link as a direct-connect
      proprietary API: Duffel's easyJet page labels it "Direct Connect", and
      AirGateway's 14 August 2023 announcement describes its Kyte-facilitated
      easyJet link as "an effective API-based connection to easyJet", listed
      separately from the "27+ major NDC airlines" it also carries.
    note: >-
      This is the structurally interesting fact about easyJet in the UK travel
      seam. NDC exists to let full-service carriers escape GDS intermediation.
      easyJet never had that problem — it was built direct, never depended on
      the GDS, and consequently had no reason to adopt IATA's remedy. It solved
      the same commercial problem a decade earlier with a proprietary API and a
      charter, and the industry's newest API-first layer (Duffel) reaches it by
      direct connect rather than by standard. The lock-in it creates is
      therefore private-contract lock-in, not standard-mediated lock-in: no
      part of an easyJet integration is reusable against another carrier.
      easyJet has been reported as working with Datalex on shop/order/payment
      implementation, but nothing about that is publicly documented as an NDC
      interface and it is not counted here.
  consumerVsDistributionSurface:
    consumer:
      apisPublished: false
      note: >-
        Flight status, check-in, boarding passes, loyalty (easyJet Plus) and
        voucher wallet are all delivered through easyjet.com and the easyJet
        app only. robots.txt disallows /BoardingPass/, /manage/,
        /*/secure/MyEasyJet.mvc and /*/Reclaim.mvc across every locale. The
        flight tracker is a web page (403 to non-browser clients), not a
        documented API. mobile.easyjet.com exists and is bot-defended. No
        consumer API is published.
    distribution:
      apisPublished: false
      apisExist: true
      note: >-
        "the easyJet API" is named in easyJet's own charter and is demonstrably
        in production — fourteen aggregators sell against it and Duffel
        documents the resulting capabilities. It is simply not documented by
        easyJet to the public. api.easyjet.com and b2b.easyjet.com are the two
        real hostnames and both are Akamai-gated 403.
